<!doctype html>
<html lang="en" class="dark relative">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <!--
      Per-route SEO/meta (title, description, canonical, OpenGraph, Twitter)
      is managed by the <Head> component: site-wide defaults live in
      src/components/layout/Layout.jsx and each page overrides them. Keep this
      template free of those tags so prerendered pages don't end up with a
      duplicate title tag or a stale canonical.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Fonts: Urbanist (display) + Inter (body) + JetBrains Mono (mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Urbanist:wght@600&family=JetBrains+Mono:wght@400;500&display=swap"
      as="style"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Urbanist:wght@600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- JSON-LD: Organization (no Instagram/X) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "console.log(ic)",
      "url": "https://consolelogic.net/",
      "logo": "https://consolelogic.net/favicon.svg",
      "sameAs": ["https://github.com/nmswainston"]
    }
    </script>

    <meta name="color-scheme" content="dark light" />
  </head>
  <body class="relative bg-surface text-foreground antialiased">
    <div id="root"></div>
    
    <!-- Hidden form for Netlify Forms detection -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" autocomplete="name" />
      <input type="email" name="email" autocomplete="email" />
      <input type="text" name="subject" autocomplete="off" />
      <textarea name="message" autocomplete="off"></textarea>
    </form>
    
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
