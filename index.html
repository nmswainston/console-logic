<!doctype html>
<html lang="en" class="dark relative">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <!-- Google tag (gtag.js) for Google Ads (AW-18591571761) and Google
         Analytics 4 (G-HWT2YSE6ZG).
         It sits near the top of <head> because Google asks for it on every
         page and as early as possible, so a visit that bounces fast still
         counts. Every route is prerendered from this template, so this one
         copy covers the whole site. The async script loads in parallel and
         never blocks rendering. The inline part sets up window.dataLayer, a
         queue that gtag() pushes into before the library has even arrived.
         Conversion event snippets call gtag('event', 'conversion', ...) and
         rely on this tag, so it has to load first.
         One tag can serve several Google products: the library loads once,
         and each gtag('config', ...) line below switches on one more
         destination. Adding a second <script src=...gtag/js> for GA4 would
         load the library twice and could count every visit twice. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18591571761"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'AW-18591571761');
      gtag('config', 'G-HWT2YSE6ZG');
    </script>
    <!--
      Per-route SEO/meta (title, description, canonical, OpenGraph, Twitter)
      is managed by the <Head> component: site-wide defaults live in
      src/components/layout/Layout.jsx and each page overrides them. Keep this
      template free of those tags so prerendered pages don't end up with a
      duplicate title tag or a stale canonical.
    -->
    <!-- Icons: favicon.svg is the source; everything else is generated from it
         by `npm run icons`. The .ico comes first with sizes="any" so browsers
         that understand SVG still prefer the SVG listed after it. The PNG is
         for browsers without SVG icons, the touch icon is what iOS uses for a
         home-screen bookmark, and the manifest points Android at its sizes. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#070C17" />

    <!-- Fonts: Inter (body) + JetBrains Mono (headings/terminal), self-hosted
         variable woff2 in /public/fonts, declared in src/styles/fonts.css.
         Preload the latin files both families need on every page; font
         preloads require crossorigin even for same-origin requests. -->
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- JSON-LD: ProfessionalService, the schema.org type for a local service
         business. It is a subtype of Organization, so nothing is lost, and it
         lets search engines connect the studio to a place and a service area.
         City-level address only, by design. No priceRange, also by design.
         (No Instagram/X.) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "@id": "https://consolelogic.net/#business",
      "name": "console.log(ic)",
      "legalName": "ConsoleLogic LLC",
      "description": "A small web studio building websites, web apps and automations for small businesses.",
      "url": "https://consolelogic.net/",
      "email": "contact@consolelogic.net",
      "image": "https://consolelogic.net/og.png",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Avondale",
        "addressRegion": "AZ",
        "addressCountry": "US"
      },
      "areaServed": [
        { "@type": "AdministrativeArea", "name": "Phoenix metropolitan area" },
        { "@type": "State", "name": "Arizona" },
        { "@type": "Country", "name": "United States" }
      ],
      "knowsAbout": ["Web design", "Web development", "Web applications", "Business process automation"],
      "logo": "https://consolelogic.net/android-chrome-512x512.png",
      "sameAs": ["https://github.com/nmswainston"]
    }
    </script>

    <meta name="color-scheme" content="dark light" />
  </head>
  <body class="relative bg-surface text-foreground antialiased">
    <div id="root"></div>
    
    <!-- Hidden form for Netlify Forms detection -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" autocomplete="name" />
      <input type="email" name="email" autocomplete="email" />
      <input type="text" name="subject" autocomplete="off" />
      <textarea name="message" autocomplete="off"></textarea>
    </form>
    
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
